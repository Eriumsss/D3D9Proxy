; NARROW + EVERY CALL -- every shutdown / destroy / free / release path (206).
;
; Ordering is the whole point: teardown bugs are almost always "freed before the
; thing that still points at it", and the call tree plus the EXECUTION ORDER
; section of retail_story.txt show that directly.
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13: the first live run
; armed them, trapped them 2,043 times, and the game died at 7.078s.
[trace]
Enabled=1
Mode=count
Set=ported
Subsystems=
Lanes=
Topics=teardown
Anchors=
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=0
SkipThunks=1
ArmSuspect=0
ArmCRT=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
