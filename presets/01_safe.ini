; STEP 1 -- THE SAFE DEFAULT. Only the 1,680 functions WE decoded and named
; by hand, one trap each (coverage), then they disarm.
;
; Why not the 6,398 of `Set=named`? Because 4,724 of those entry points come
; from Ghidra's analysis of Scaleform and the CRT and have never been validated
; by anyone. Ours were each read instruction by instruction during the port.
; An entry point that is off by one byte plants 0xCC in the middle of a real
; instruction, and the interlock cannot catch that -- it compares against the
; same possibly-wrong address on disk.
;
; This is the widest set we have actually earned the right to trust.
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13.
[trace]
Enabled=1
Mode=coverage
Set=ported
Subsystems=
Lanes=
Topics=
Anchors=
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
ArmDelayMs=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
