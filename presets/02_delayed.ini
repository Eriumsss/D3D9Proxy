; STEP 2 -- BISECT. Same as the safe default, but the game boots
; UNINSTRUMENTED for 20 seconds first. If it reaches the menu and then dies the
; moment the ARMED line appears in retail_calls.log, the tracer is the cause and
; we know it acts instantly. If it dies before that line, it never was.
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13.
[trace]
Enabled=1
Mode=coverage
Set=ported
Subsystems=
Lanes=
Topics=
Anchors=
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
ArmDelayMs=20000
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
