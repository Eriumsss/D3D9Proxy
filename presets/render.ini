; THE RENDER READ -- same full coverage capture as everything.ini, with the
; render phases anchored so a frame's structure is findable by eye in the log.
; Anchors change nothing about what is captured, only how it reads:
;   0x006a32c7 drain RunPassF     0x00689578 tonemap Run
;   0x0068928b BrightPass         0x006893ef LumAdapt (metering)
;   0x0070eb12 DomeUpdate         0x007106cf CloudBuild
;   0x00713a79 SprayRender        0x0068e383 ring FrameRotate
;   0x006a6f74 shader FillFromBin 0x006a64ea CreateShaders
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13: the first live run
; armed them, trapped them 2,043 times, and the game died at 7.078s.
[trace]
Enabled=1
Mode=coverage
Set=named
Subsystems=
Lanes=
Topics=
Anchors=0x006a32c7,0x00689578,0x0068928b,0x006893ef,0x0070eb12,0x007106cf,0x00713a79,0x0068e383,0x006a6f74,0x006a64ea
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
