; EVERY ADDRESS WE KNOW BY NAME -- all 6,398: the 1,680 we ported and decoded
; ourselves, plus the 4,724 whose real symbol survived in the binary.
;
; COVERAGE mode: each function traps ONCE, logs itself with its caller, then
; disarms. That is ~6,000 traps for the whole session instead of ~109,000 per
; SECOND, and it is the right instrument for "what runs, in what order" --
; which is the question. You get the complete first-appearance sequence, the
; call tree, and every caller resolved by name.
;
; It does NOT give repeat counts. For those use a narrow preset (shaders.ini,
; teardown.ini) or count_ported.ini, which limit how much can go hot at once.
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13: the first live run
; armed them, trapped them 2,043 times, and the game died at 7.078s.
[trace]
Enabled=1
Mode=coverage
Set=named
Subsystems=
Lanes=
Topics=
Anchors=
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
