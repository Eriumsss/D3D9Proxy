; CALL COUNTS over the 1,680 functions we decoded ourselves.
;
; count mode re-arms after every hit, so you get repetition and the full call
; sequence, not just first appearance. That costs one CPU exception per call.
; Two governors keep it survivable and neither is silent:
;   MaxHitsPerSec       retires a single runaway function  -> "!! HOT <name>"
;   MaxTotalHitsPerSec  watches the SUM across all of them -> degrades the
;                       whole tracer to coverage and says exactly where
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13: the first live run
; armed them, trapped them 2,043 times, and the game died at 7.078s.
[trace]
Enabled=1
Mode=count
Set=ported
Subsystems=
Lanes=
Topics=
Anchors=
ArmOnLoad=1
MaxHitsPerSec=5000
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
