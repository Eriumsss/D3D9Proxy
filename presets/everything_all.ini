; THE WIDEST NET -- all 30,584 catalogued entry points, one shot each.
;
; Same cost profile as everything.ini (one trap per function, ever), just five
; times as many functions. Use it to find code we have NOT decoded yet that runs
; during something you care about: those appear as FUN_00xxxxxx in
; retail_story.txt with the caller resolved to a name we DO know, which is
; exactly the lead you want.
; 13 functions are NEVER armed whatever this file says -- __SEH_prolog4,
; __SEH_epilog4, __except_handler4, RtlUnwind and friends. A breakpoint tracer
; runs inside exception dispatch, so instrumenting the code that builds
; exception frames kills the process. Proven on 2026-08-13: the first live run
; armed them, trapped them 2,043 times, and the game died at 7.078s.
[trace]
Enabled=1
Mode=coverage
Set=all
Subsystems=
Lanes=
Topics=
Anchors=
ArmOnLoad=1
MaxHitsPerSec=0
MaxTotalHitsPerSec=60000
SkipThunks=1
ArmSuspect=0
ArmCRT=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
