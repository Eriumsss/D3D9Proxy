; STEP 0 -- THE CONTROL. Nothing is patched at all: Enabled=0 means the DLL
; loads, writes its header, and touches nothing.
;
; Run this FIRST when the game will not start. It answers the only question
; that matters at that point: is the tracer the problem, or is it the way the
; game is being launched? If the game misbehaves with this file in place, the
; tracer is innocent and the fault is elsewhere.
[trace]
Enabled=0
SkipThunks=1
ArmSuspect=0
ArmCRT=0
ArmDelayMs=0
Tree=1
RingSize=262144
FlushMs=100
CoverageEverySec=20
LogArgs=4
LogFile=retail_calls.log
CoverageFile=retail_coverage.csv
KeyToggle=0x54
KeyDump=0x44
KeyPanic=0x58
