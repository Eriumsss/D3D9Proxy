name: D3D9Proxy Standalone Static Pool CI
on:
  push:
    paths:
      - 'tools/pak_pool_preflight.py'
      - 'tests/test_pak_pool_preflight.py'
      - 'tests/test_static_geometry_preflight.py'
      - 'tests/test_model_bin_link_preflight.py'
      - 'tools/native_geometry_links.py'
      - 'tools/native_collision_links.py'
      - 'tools/native_collision_provenance.py'
      - 'tests/test_collision_provenance.py'
      - 'tests/test_native_collision_links.py'
      - 'tests/test_native_table_preflight.py'
      - 'tests/test_geometry_budget_telemetry.py'
      - 'src/geometry_budget_telemetry.cpp'
      - 'src/retail_texture_vault.cpp'
      - 'src/retail_texture_vault.h'
      - 'tests/test_retail_texture_vault.py'
      - 'src/geometry_budget_telemetry.h'
      - 'src/d3d9device.cpp'
      - 'src/static_pool_census.cpp'
      - 'src/static_pool_census.h'
      - 'src/model_registry_2048.cpp'
      - 'src/model_registry_2048.h'
      - 'src/texture_registry_4096.cpp'
      - 'src/texture_registry_4096.h'
      - 'src/effect_registry_1024.cpp'
      - 'src/effect_registry_1024.h'
      - 'src/gfx_registry_512.cpp'
      - 'src/gfx_registry_512.h'
      - 'tests/test_gfx_registry_512.py'
      - 'GFX_REGISTRY_512.md'
      - 'tests/test_effect_registry_1024.py'
      - 'tests/test_texture_registry_4096.py'
      - 'tests/test_extended_registry_tiers.py'
      - 'REGISTRY_CAPACITY_TIERS.md'
      - 'tests/test_model_registry_2048.py'
      - 'src/d3d9proxy.cpp'
      - 'build.bat'
      - '.github/workflows/static-map-pak-preflight.yml'
  pull_request:
    paths:
      - 'tools/pak_pool_preflight.py'
      - 'tests/test_pak_pool_preflight.py'
      - 'tests/test_static_geometry_preflight.py'
      - 'tests/test_model_bin_link_preflight.py'
      - 'tools/native_geometry_links.py'
      - 'tools/native_collision_links.py'
      - 'tools/native_collision_provenance.py'
      - 'tests/test_collision_provenance.py'
      - 'tests/test_native_collision_links.py'
      - 'tests/test_native_table_preflight.py'
      - 'tests/test_geometry_budget_telemetry.py'
      - 'src/geometry_budget_telemetry.cpp'
      - 'src/retail_texture_vault.cpp'
      - 'src/retail_texture_vault.h'
      - 'tests/test_retail_texture_vault.py'
      - 'src/geometry_budget_telemetry.h'
      - 'src/d3d9device.cpp'
      - 'src/static_pool_census.cpp'
      - 'src/static_pool_census.h'
      - 'src/model_registry_2048.cpp'
      - 'src/model_registry_2048.h'
      - 'src/texture_registry_4096.cpp'
      - 'src/texture_registry_4096.h'
      - 'src/effect_registry_1024.cpp'
      - 'src/effect_registry_1024.h'
      - 'src/gfx_registry_512.cpp'
      - 'src/gfx_registry_512.h'
      - 'tests/test_gfx_registry_512.py'
      - 'GFX_REGISTRY_512.md'
      - 'tests/test_effect_registry_1024.py'
      - 'tests/test_texture_registry_4096.py'
      - 'tests/test_extended_registry_tiers.py'
      - 'REGISTRY_CAPACITY_TIERS.md'
      - 'tests/test_model_registry_2048.py'
      - 'src/d3d9proxy.cpp'
      - 'build.bat'
      - '.github/workflows/static-map-pak-preflight.yml'
jobs:
  pak-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile tools/pak_pool_preflight.py tests/test_pak_pool_preflight.py tests/test_static_geometry_preflight.py tests/test_native_table_preflight.py tests/test_model_bin_link_preflight.py tools/native_geometry_links.py tools/native_collision_links.py tests/test_native_collision_links.py tools/native_collision_provenance.py tests/test_collision_provenance.py
      - name: Synthetic PC PAK and pool-cap regression tests
        run: python3 -m unittest discover -s tests -p test_pak_pool_preflight.py -v
      - name: Synthetic PC PAK Block2 static geometry buffer validation
        run: python3 -m unittest discover -s tests -p test_static_geometry_preflight.py -v
      - name: Retail texture vault Python regression tests
        run: python3 -m unittest discover -s tests -p test_retail_texture_vault.py -v
      - name: Synthetic PAK and BIN model reference, asset span and zlib stream validation
        run: python3 -m unittest discover -s tests -p test_model_bin_link_preflight.py -v
      - name: Native collision ShapeInfo/HkShapeInfo/MOPP Block1 reference chain
        run: python3 -m unittest discover -s tests -p test_native_collision_links.py -v
      - name: Donor-to-merged native Havok/MOPP collision preservation regression
        run: python3 -m unittest discover -s tests -p test_collision_provenance.py -v
      - name: Native BufferInfo, materials and Havok descriptor envelope checks
        run: python3 -m unittest discover -s tests -p test_native_table_preflight.py -v
      - name: Read-only retail static D3D buffer allocation telemetry contracts
        run: python3 -m unittest discover -s tests -p test_geometry_budget_telemetry.py -v
      - name: GZF model registry x86 opcode and transactional patch contract
        run: python3 -m unittest discover -s tests -p test_model_registry_2048.py -v
      - name: GZF texture registry x86 opcode and 4096-entry patch contract
        run: python3 -m unittest discover -s tests -p test_texture_registry_4096.py -v
      - name: GZF effect registry x86 opcode and 1024-entry patch contract
        run: python3 -m unittest discover -s tests -p test_effect_registry_1024.py -v
      - name: Higher-tier native model/texture/effect registry capacity regression
        run: python3 -m unittest discover -s tests -p test_extended_registry_tiers.py -v
      - name: GFX native registry 64-to-256-or-512 x86 trampoline contract
        run: python3 -m unittest discover -s tests -p test_gfx_registry_512.py -v
  retail-x86-module-compile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build static pool census with actual MSVC x86
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 2
          for /f "usebackq delims=" %%V in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%V"
          if not defined VSROOT exit /b 3
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:static_pool_census.obj src\static_pool_census.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:model_registry_2048.obj src\model_registry_2048.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:texture_registry_4096.obj src\texture_registry_4096.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:effect_registry_1024.obj src\effect_registry_1024.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:gfx_registry_512.obj src\gfx_registry_512.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:geometry_budget_telemetry.obj src\geometry_budget_telemetry.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /W3 /EHsc /c /Fo:d3d9proxy.obj src\d3d9proxy.cpp
          if errorlevel 1 exit /b 1
      - name: Compile and link complete OpenConquest D3D9Proxy x86 DLL
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%V in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%V"
          if not defined VSROOT exit /b 3
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          cd /d src
          cl /nologo /c /EHsc /W0 /MD /O2 /D WIN32 /D NDEBUG /D WIN32_LEAN_AND_MEAN /D NOMINMAX /D _WINDLL d3d9device.cpp d3d9proxy.cpp overlay.cpp memorypatch.cpp filehook.cpp vespucci_bridge.cpp stronghold_log.cpp crowd_event_handler.cpp retail_fn_trace.cpp retail_heap_extender.cpp static_pool_census.cpp model_registry_2048.cpp texture_registry_4096.cpp effect_registry_1024.cpp gfx_registry_512.cpp geometry_budget_telemetry.cpp retail_texture_vault.cpp
          if errorlevel 1 exit /b 1
          link /DLL /OUT:d3d9.dll /DEF:d3d9proxy.def /NOLOGO d3d9device.obj d3d9proxy.obj overlay.obj memorypatch.obj filehook.obj vespucci_bridge.obj stronghold_log.obj crowd_event_handler.obj retail_fn_trace.obj retail_heap_extender.obj static_pool_census.obj model_registry_2048.obj texture_registry_4096.obj effect_registry_1024.obj gfx_registry_512.obj geometry_budget_telemetry.obj retail_texture_vault.obj d3d9.lib dxguid.lib uuid.lib user32.lib kernel32.lib
          if errorlevel 1 exit /b 1
          dumpbin /headers d3d9.dll | findstr /i "machine x86"
          if errorlevel 1 exit /b 1
      - name: Archive opt-in experimental x86 proxy DLL (default model expansion OFF)
        uses: actions/upload-artifact@v4
        with:
          name: d3d9proxy-static-map-geometry-budget-x86
          path: src/d3d9.dll
          if-no-files-found: error
          retention-days: 7
